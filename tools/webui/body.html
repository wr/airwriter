<main>

<div class=unit>

  <div class=sec>
    <div class=grooves></div>
    <div class=ledge></div>
    <div class=plate>
      <div><h1>AirWriter</h1><p class=model><span id=model>&nbsp;</span><span id=rib></span></p></div>
      <div class=stack>
        <!-- Each lamp is two LEDs: the left one is state, the right one is
             the thing that changes. -->
        <div class=lamp><span class=bar>
          <span class=seg id=ledfault data-tip="no fault"></span>
          <span class="seg g" data-tip="powered"></span></span><b>error / pwr</b></div>
        <div class=lamp><span class=bar>
          <span class=seg id=ledlink data-tip="not on a network"></span>
          <span class=seg id=ledact data-tip="network traffic"></span></span><b>network</b></div>
        <div class=lamp><span class=bar>
          <span class=seg id=ledprn data-tip="no printer"></span>
          <span class=seg id=ledjob data-tip="idle"></span></span><b>printer / job</b></div>
      </div>
    </div>
    <p class=job id=job>&nbsp;</p>
  </div>

  <!-- Every section is laid out the same way: its heading, what it shows,
       then one row with what it has to say on the left and its keys on the
       right. Every action is a key. -->

  <div class=sec>
    <h2>wi-fi</h2>
    <div class="paper bars"><div class=sheet><div class=nets>
      <div class=scroll id=rows></div></div></div></div>
    <div id=extra></div>
    <div class=row>
      <p class=say id=wifisay></p>
      <div class=keys>
        <div class=key><span class=legend>scan</span>
          <span class=keyrow>
            <span class="bar keylamp"><span class=seg id=scanled></span></span>
            <span class=slot><button id=scan aria-label=Scan></button></span>
          </span></div>
        <div class="key is-quiet" id=joinkey><span class=legend>join</span>
          <span class='slot momentary'><button id=join aria-label=Join disabled></button></span></div>
      </div>
    </div>
  </div>

  <div class=sec id=sec-halftone>
    <h2>halftone</h2>
    <div class=paper><div class=sheet><canvas id=prev></canvas></div></div>
    <div class=row>
      <div class=keys id=tabs></div>
    </div>
  </div>

  <div class=sec id=sec-printer>
    <h2>printer</h2>
    <div class=grid2>
      <div><label for=devsel>model</label><select id=devsel></select></div>
      <div><label for=host>hostname</label><input id=host autocomplete=off></div>
    </div>
    <div><label for=queue id=qlbl class=hide>name</label>
      <input id=queue class=hide autocomplete=off placeholder="Printer name"></div>
    <!-- For adding the printer by hand, where AirPrint does not find it. -->
    <label for=uri>address</label><input id=uri readonly>
    <div class=row>
      <p class=say id=prnsay></p>
      <div class=keys>
        <div class=key><span class=legend>copy</span>
          <span class='slot momentary'><button id=copy aria-label="Copy the address"></button></span></div>
        <div class=key><span class=legend>save</span>
          <span class='slot momentary'><button id=savegen aria-label=Save></button></span></div>
      </div>
    </div>
  </div>

  <div class=sec id=sec-firmware>
    <h2>firmware</h2>
    <div class=row>
      <p class=say id=fwsay>&nbsp;</p>
      <div class=keys>
        <div class=key id=fwupdkey><span class=legend>update</span>
          <span class=keyrow>
            <span class="bar keylamp"><span class=seg id=fwled></span></span>
            <span class='slot momentary'><button id=fwupd aria-label="Look for a new release, or install it"></button></span>
          </span></div>
        <div class=key id=fwautokey><span class=legend>auto</span>
          <span class=slot><button id=fwauto aria-label="Install new releases automatically" aria-pressed=false></button></span></div>
        <div class=key id=fwfilekey><span class=legend>file</span>
          <span class='slot momentary'><button id=upd aria-label="Install a release from a file"></button></span></div>
      </div>
    </div>
  </div>

  <div class='sec hide' id=sec-cable>
    <h2>cable</h2>
    <div class=row>
      <p class=say id=cablesay></p>
      <div class=keys>
        <!-- TashTalk is the LocalTalk chip's firmware. An assembled AirWriter
             has it, so this key shows only once a test finds the chip blank. -->
        <div class='key hide' id=flashkey><span class=legend>flash</span>
          <span class='slot momentary'><button id=ltflash aria-label="Flash TashTalk onto the LocalTalk chip"></button></span></div>
        <div class=key><span class=legend>test</span>
          <span class='slot momentary'><button id=cabletest aria-label="Test a cable"></button></span></div>
      </div>
    </div>
  </div>

</div>

<p class=foot>
  Made by <a href="https://wells.ee" target=_blank rel=noopener>Wells Workshop</a>
  <span class=sep>&middot;</span><a href="https://github.com/wr/airwriter" target=_blank
    rel=noopener>Project home</a>
</p>
<input id=fw type=file accept=.bin class=hide>
</main>

<div id=tip></div>

<div id=over class=hide><div id=big></div>
  <div id=ovt>Restarting</div><p id=ovs></p>
  <button id=ovbtn class=q type=button>Reload</button></div>
